version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: waypoint_postgis
    environment:
      POSTGRES_DB: waypoint_secure
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./infrastructure/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint_secure"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: waypoint_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
  redis_data:
